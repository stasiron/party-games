<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1e" />
    <title>Brak sieci — Party Games</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: linear-gradient(160deg, #0a0f1e 0%, #2a113a 50%, #8c215e 100%);
        color: #f3e8ff;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { margin: 0 0 12px; line-height: 1.5; opacity: 0.92; }
      .last-room {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-weight: 600;
      }
      .hint { font-size: 0.9rem; opacity: 0.75; }
    </style>
  </head>
  <body>
    <main>
      <h1>Brak połączenia z siecią</h1>
      <p>Otwórz ponownie aplikację, gdy będziesz online.</p>
      <p class="hint">Gry w pokoju wymagają aktywnego internetu — tryb offline obejmuje tylko interfejs aplikacji.</p>
      <p id="last-room" class="last-room" hidden></p>
    </main>
    <script>
      try {
        var code = localStorage.getItem('partyGames.lastRoomId.v1');
        if (code) {
          var el = document.getElementById('last-room');
          el.hidden = false;
          el.textContent = 'Ostatni pokój: ' + code;
        }
      } catch (_) {}
    </script>
  </body>
</html>
